<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Hors ligne — Fil EPS</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f6f5;
      color: #14211e;
      font-family: "Segoe UI", sans-serif;
    }
    main { max-width: 28rem; padding: 2rem 1.25rem; text-align: center; }
    h1 { margin: 1rem 0 0.5rem; font-size: 1.6rem; letter-spacing: -0.03em; }
    p { margin: 0; color: #5d6b66; line-height: 1.55; }
    .actions { display: flex; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; }
    button, a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      font: inherit;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }
    button { border: 0; background: #0f766e; color: white; }
    a { border: 1px solid #e4e9e6; background: white; color: #14211e; }
    @media (prefers-color-scheme: dark) {
      body { background: #101412; color: #f3f6f4; }
      p { color: #b7c2bd; }
      a { background: #181d1b; color: #f3f6f4; border-color: #2c3330; }
    }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="7" fill="#0f766e"/>
      <path d="M9.2 23.6V8.4H22.8M9.2 15.6H18.6" fill="none" stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>Vous êtes hors ligne</h1>
    <p>Fil EPS n’arrive pas à joindre le serveur. Les pages déjà ouvertes dans cette application restent disponibles.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Réessayer</button>
      <a href="/">Accueil</a>
    </div>
  </main>
</body>
</html>
