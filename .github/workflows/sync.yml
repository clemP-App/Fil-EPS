name: Synchronisation quotidienne

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_SSL: require
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Synchroniser vers PostgreSQL
        if: env.DATABASE_URL != ''
        run: npm run sync
        env:
          CI: "true"
